<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>页面不存在</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f3ee; color: #141311;
           font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    main { padding: 16px; text-align: center; }
    h1 { font-family: "Songti SC", "STSong", "SimSun", serif; font-size: 32px; margin: 8px 0 20px; }
    p { color: #575249; letter-spacing: .1em; margin: 0; }
    a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <p>404</p>
    <h1>页面不存在</h1>
    <a id="home" href="/">返回首页</a>
  </main>
  <script>
    // 网站放在子路径（如 /homepage/）时也能回到首页
    var seg = location.pathname.split('/')[1];
    if (location.hostname.endsWith('github.io') && seg && seg.indexOf('.') < 0) {
      fetch('/' + seg + '/content.js', { method: 'HEAD' }).then(function (r) {
        if (r.ok) document.getElementById('home').href = '/' + seg + '/';
      });
    }
  </script>
</body>
</html>
